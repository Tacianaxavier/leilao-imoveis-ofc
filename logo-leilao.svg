<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none" role="img" aria-label="Leilão Imóveis">
  <defs>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Monogram Mark -->
  <g transform="translate(10, 10)" filter="url(#subtleGlow)">
    <!-- Coral Left-Bottom Angular Element -->
    <path d="M 0 14 L 18 0 L 18 48 L 46 48 L 46 70 L 0 70 Z" fill="url(#coralGrad)"/>
    <!-- Teal Top-Right Angular Element -->
    <path d="M 22 22 L 72 22 L 72 70 L 52 50 L 52 2 Z" fill="url(#tealGrad)" opacity="0"/>
    <!-- Interlocking Teal Shape -->
    <path d="M 26 2 L 72 2 L 72 58 L 54 72 L 54 24 L 26 24 Z" fill="url(#tealGrad)"/>
  </g>

  <!-- Typography: LEILÃO IMÓVEIS -->
  <g transform="translate(98, 14)">
    <!-- LEILÃO -->
    <text x="0" y="30" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="29" font-weight="900" letter-spacing="4px" fill="#0F766E">LEILÃO</text>
    <!-- IMÓVEIS -->
    <text x="0" y="58" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="6px" fill="#1E293B">IMÓVEIS</text>
  </g>

  <!-- Verified Badge / Decorative Tag -->
  <g transform="translate(290, 24)">
    <rect width="78" height="20" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
    <circle cx="10" cy="10" r="4" fill="#10B981"/>
    <text x="20" y="14" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#065F46" letter-spacing="0.5px">OFICIAL</text>
  </g>
</svg>
