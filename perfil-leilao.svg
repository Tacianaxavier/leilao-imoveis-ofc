<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none" role="img" aria-label="Foto de Perfil Oficial Leilão Imóveis">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D14"/>
    </radialGradient>
    <linearGradient id="coralGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A50"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <linearGradient id="tealGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="250" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Ring -->
  <circle cx="250" cy="250" r="236" stroke="url(#goldBorder)" stroke-width="4" stroke-opacity="0.85"/>
  <circle cx="250" cy="250" r="226" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Center Logo Monogram -->
  <g transform="translate(170, 95)" filter="url(#pGlow)">
    <!-- Coral Left-Bottom Angular Element -->
    <path d="M 0 32 L 40 0 L 40 108 L 102 108 L 102 156 L 0 156 Z" fill="url(#coralGradP)"/>
    <!-- Interlocking Teal Top-Right Element -->
    <path d="M 58 6 L 160 6 L 160 130 L 120 162 L 120 54 L 58 54 Z" fill="url(#tealGradP)"/>
  </g>

  <!-- Main Brand Title - High Legibility -->
  <text x="250" y="325" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="8px" fill="#2DD4BF">LEILÃO</text>
  <text x="250" y="375" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="12px" fill="#FFFFFF">IMÓVEIS</text>

  <!-- Subtitle Tag -->
  <g transform="translate(130, 405)">
    <rect width="240" height="34" rx="17" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Verified icon -->
    <circle cx="26" cy="17" r="9" fill="#0EA5E9"/>
    <path d="M22 17 L25 20 L30 14" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="2px" fill="#E2E8F0">PORTAL OFICIAL</text>
  </g>
</svg>
